# docker-compose.yml
# AI 求职作品集 Docker 编排
# 用法：docker-compose up -d（后台启动）/ docker-compose down（停止）

services:
  # 后端服务：FastAPI + LangGraph Agent
  backend:
    build: ./backend
    container_name: ai-portfolio-backend
    ports:
      - "127.0.0.1:8000:8000" # 只绑本机回环：外部只能走 Nginx(80/443)，后端不直接暴露
    env_file:
      - ./backend/.env # API Keys 从 .env 注入（不进镜像）
    volumes:
      - chroma_data:/root/.ai_portfolio # ChromaDB 持久化（容器重启数据不丢）
    restart: unless-stopped # 崩溃自动重启
    healthcheck:
      # 真实 AI 链路探测（1 token 最小调用），防「/health 绿灯但聊天已挂」的假绿灯
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/health/ai', timeout=12); exit(0 if r.status_code == 200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 20s

# 数据卷（持久化 ChromaDB）
volumes:
  chroma_data:
